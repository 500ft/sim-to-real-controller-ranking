name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main, "task/priority-one-*"]

jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install evidence-test dependencies
      run: |
        python -m pip install -r requirements-item11-regression.txt
        python -m pip install -r requirements-report.txt
        # replay generator (test_replay_metrics); hold numpy at the pinned env's version
        python -m pip install "matplotlib>=3.7,<3.9" "$(python -m pip freeze | grep -i '^numpy==')"

    - name: Run evidence tests
      env:
        PYTHONPATH: gym
      run: |
        python experiments/test_rosbag_to_telemetry.py
        python experiments/test_bag_evidence.py
        python experiments/test_real_command_response.py
        python experiments/validate_item11.py
        python experiments/test_mast_physical_validation.py
        python experiments/test_cad_inputs.py
        python experiments/test_final_report.py
        python experiments/test_dynamics_loader.py
        python experiments/test_replay_metrics.py
        python experiments/test_report_figures.py
        python experiments/test_controller_pipeline_results.py
        python -m unittest discover -s experiments -p "test_figure_*.py"
    - name: Equipment acquisition tooling (replay only; no device, no pyserial)
      run: |
        python experiments/test_measurement_logger.py
        python experiments/test_load_cell_calibration.py
        python cad/tests/test_fixture_feasibility.py
        python cad/tests/test_unattended.py
        python -m py_compile firmware/measurement_node/code.py
    - name: Check README links, identity and negative controls
      run: |
        python tools/check_presentation.py . "Sim-to-Real Controller Ranking" sim-to-real-controller-ranking
        python tools/test_presentation.py

  ope-structural-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - run: python -m pip install -r requirements-ope-qualification.txt
    - name: Structural reader unit tests (no third-party archive download)
      run: python experiments/test_ope_qualification.py

  ope-corrected-v2-reward-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - run: python -m pip install -r requirements-ope-corrected-v2.txt
    - name: Common reward and simulator bridge boundary cases (no third-party archive download)
      run: python -m unittest experiments.test_common_reward_v2 experiments.test_simulator_reward_adapter_v2
